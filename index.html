function profitSeries(transactions, rangeDays) {
  if (rangeDays <= 30) {
    const days = [];
    for (let i = rangeDays - 1; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push({
        key: dayKey(d.toISOString()),
        label: rangeDays <= 7 ? d.toLocaleDateString("id-ID", {
          weekday: "short"
        }) : d.getDate().toString(),
        profit: 0
      });
    }
    transactions.forEach(t => {
      const k = dayKey(t.date);
      const day = days.find(d => d.key === k);
      if (day) day.profit += t.profit;
    });
    return days;
  }
  const numWeeks = Math.ceil(rangeDays / 7);

    const end = new Date();

    start.setDate(start.getDate() - 6);
    weeks.push({
      key: dayKey(start.toISOString()),
      start: dayKey(start.toISOString()),
      end: dayKey(end.toISOString()),
      label: `${start.getDate()}/${start.getMonth() + 1}`,
      profit: 0
    });

    const k = dayKey(t.date);
    const w = weeks.find(w => k >= w.start && k <= w.end);
    if (w) w.profit += t.profit;
  });
  return weeks;
}
